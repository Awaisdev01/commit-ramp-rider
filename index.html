<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commit Ramp Rider — My Year as a Dirt Bike Track</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;color:#e8e6e3;font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif;overflow:hidden}
  #wrap{position:relative;height:100%}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;top:14px;left:16px;user-select:none}
  .hud h1{font-size:17px;margin:0 0 2px;letter-spacing:.5px}
  .hud p{font-size:12px;margin:0;color:#9aa3ad}
  .foot{position:absolute;bottom:12px;left:16px;font-size:11.5px;color:#9aa3ad;max-width:520px;line-height:1.5}
  .btn{position:absolute;top:14px;right:16px;background:#B7FF45;color:#101114;border:0;border-radius:10px;padding:9px 16px;font-weight:700;font-family:inherit;font-size:13px;cursor:pointer}
  .legend{position:absolute;bottom:12px;right:16px;font-size:11px;color:#9aa3ad;text-align:right}
</style></head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud"><h1>🏍️ COMMIT RAMP RIDER</h1><p>My commit history as a dirt bike track — every day is a hill</p></div>
  <button class="btn" id="again">Ride again</button>
  <div class="foot">Built with plain JavaScript — custom physics, custom sound, no game engine. Commit days became ramps; bigger days, bigger jumps.</div>
  <div class="legend" id="legend"></div>
</div>
<script>
// ---- Track data: real commit counts per day (Nov 2026 sprint) ----
const DAYS = [
  ["Nov 1",3],["Nov 2",28],["Nov 3",4],["Nov 4",15],["Nov 5",3],["Nov 7",1],
  ["Nov 9",2],["Nov 10",5],["Nov 11",2],["Nov 17",4],["Nov 18",10],
  ["Nov 19",7],["Nov 20",14],["Nov 23",55]
];
const MAX = 55;
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
let W,H;
function resize(){W=cvs.width=innerWidth*devicePixelRatio;H=cvs.height=innerHeight*devicePixelRatio;cvs.style.width=innerWidth+'px';cvs.style.height=innerHeight+'px';}
addEventListener('resize',resize);resize();

// Build ramp heights from commit counts (log-ish scale so small days still roll)
const ramps = DAYS.map(([label,n])=>({label, n, h: Math.max(20, 26+Math.pow(n/MAX,0.75)*(H*0.34/devicePixelRatio)) }));

let speed = 0, pos = 0, vy = 0, y = 0, onGround = true, rot = 0, done=false, t0=performance.now(), engine=null, airtime=0, bestAir=0;
const groundY = ()=> H - 90*devicePixelRatio;
function rampAt(x){
  // piecewise: flat run-in, then for each ramp: up-slope, peak, down-slope, flat gap
  const seg=170*devicePixelRatio, gap=110*devicePixelRatio;
  let x0 = 240*devicePixelRatio;
  for(const r of ramps){
    if(x < x0) return {y:groundY(), ramp:r, phase:'flat'};
    if(x < x0+seg*0.35) return {y:groundY() - r.h*(x-x0)/(seg*0.35), ramp:r, phase:'up'};
    if(x < x0+seg*0.55) return {y:groundY()-r.h, ramp:r, phase:'peak'};
    if(x < x0+seg) return {y:groundY()-r.h*(1-(x-x0-seg*0.55)/(seg*0.45)), ramp:r, phase:'down'};
    x0 += seg + gap + r.h*0.5;
  }
  return {y:groundY(), ramp:null, phase:'end'};
}
function physics(dt){
  speed = Math.min(340*devicePixelRatio, speed + 60*devicePixelRatio*dt);
  pos += speed*dt;
  const g = rampAt(pos+18*devicePixelRatio), g2 = rampAt(pos+42*devicePixelRatio);
  const ground = Math.min(g.y, g2.y);
  if(onGround){
    y = ground;
    // leave ground if dropping
    const nextG = rampAt(pos + speed*dt*3 + 30*devicePixelRatio).y;
    if(nextG > y + 2){ onGround=false; vy=0; airtime=0; }
  } else {
    vy += 980*devicePixelRatio*dt;
    y += vy*dt;
    airtime += dt;
    if(y >= ground){ y=ground; onGround=true; bestAir=Math.max(bestAir,airtime); land(); }
  }
  if(pos > 240*devicePixelRatio + DAYS.length*300*devicePixelRatio) done=true;
  rot += (onGround?0:0.9)*dt;
}
let particles=[];
function land(){
  for(let i=0;i<14;i++) particles.push({x:pos+Math.random()*40*devicePixelRatio,y:groundY(),vx:(Math.random()*2-1)*160*devicePixelRatio,vy:-Math.random()*260*devicePixelRatio,l:0.6+Math.random()*0.4});
  thump();
}
// ---- sound: custom WebAudio engine + thump ----
let actx=null, osc=null, gain=null;
function engineSound(){
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  osc = actx.createOscillator(); gain=actx.createGain();
  osc.type='sawtooth'; osc.frequency.value=70;
  gain.gain.value=0.05; osc.connect(gain).connect(actx.destination); osc.start();
}
function setEngine(hz){ if(osc&&osc.frequency) osc.frequency.setTargetAtTime(hz,actx.currentTime,0.05); }
function thump(){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='triangle'; o.frequency.value=110; g.gain.value=0.18;
  o.connect(g).connect(actx.destination); o.start();
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.18);
  o.frequency.exponentialRampToValueAtTime(45,actx.currentTime+0.18);
  o.stop(actx.currentTime+0.2);
}
function stopEngine(){ try{osc&&osc.stop()}catch(e){} osc=null }
// ---- render ----
function draw(t){
  ctx.clearRect(0,0,W,H);
  const dpr=devicePixelRatio;
  // sky gradient
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0b0d10');sky.addColorStop(1,'#141a20');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // stars
  for(let i=0;i<60;i++){ctx.fillStyle='rgba(255,255,255,'+(0.2+((i*37)%50)/250)+')';ctx.fillRect((i*971)%W,(i*613)%(H*0.5),2*dpr,2*dpr);}
  // ground fill
  const step=8*dpr; ctx.fillStyle='#26302c'; ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=step){ const g=rampAt(x); ctx.lineTo(x,g.y); }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#3d5245'; ctx.lineWidth=2*dpr; ctx.beginPath();
  for(let x=0;x<=W;x+=step){ const g=rampAt(x); x===0?ctx.moveTo(x,g.y):ctx.lineTo(x,g.y); }
  ctx.stroke();
  // ramp day labels + counts
  ctx.textAlign='center';
  let x0=240*dpr; const seg=170*dpr,gap=110*dpr;
  for(const r of ramps){
    const cx=x0+seg*0.45;
    ctx.fillStyle = r.n>=20?'#B7FF45':'#9aa3ad';
    ctx.font=`${Math.min(13,8+r.n/8)*dpr}px 'Space Grotesk',sans-serif`;
    ctx.fillText(r.label+' · '+r.n, cx, groundY()-r.h-12*dpr);
    x0+=seg+gap+r.h*0.5;
  }
  // bike
  ctx.save(); ctx.translate(pos,y-10*dpr); ctx.rotate(rot*0.3);
  // wheels
  ctx.strokeStyle='#e8e6e3'; ctx.lineWidth=3*dpr;
  ctx.beginPath(); ctx.arc(-16*dpr,0,10*dpr,0,7); ctx.stroke();
  ctx.beginPath(); ctx.arc(16*dpr,0,10*dpr,0,7); ctx.stroke();
  // frame
  ctx.strokeStyle='#B7FF45'; ctx.lineWidth=3.5*dpr;
  ctx.beginPath(); ctx.moveTo(-16*dpr,0); ctx.lineTo(0,-8*dpr); ctx.lineTo(14*dpr,-4*dpr); ctx.stroke();
  // rider
  ctx.fillStyle='#e8e6e3';
  ctx.beginPath(); ctx.arc(2*dpr,-20*dpr,5*dpr,0,7); ctx.fill();
  ctx.fillRect(-1*dpr,-16*dpr,6*dpr,10*dpr);
  ctx.restore();
  // dust particles
  particles=particles.filter(p=>p.l>0);
  for(const p of particles){ p.x+=p.vx*0.016; p.y+=p.vy*0.016; p.vy+=800*dpr*0.016; p.l-=0.02;
    ctx.fillStyle=`rgba(155,120,90,${p.l})`; ctx.fillRect(p.x,p.y,4*dpr,4*dpr); }
  // HUD speed + air
  ctx.fillStyle='#9aa3ad'; ctx.font=11*dpr+'px sans-serif'; ctx.textAlign='left';
  ctx.fillText(`speed ${(speed/(dpr)).toFixed(0)} · air ${onGround?'—':airtime.toFixed(2)+'s'} · best air ${bestAir.toFixed(2)}s`, 16*dpr, H-20*dpr);
}
function loop(t){
  const dt=Math.min(0.033,(t-t0)/1000); t0=t;
  if(!done){ physics(dt); setEngine(70+speed/(40*devicePixelRatio)); }
  else { setEngine(40); if(Math.random()<0.02) thump(); }
  draw(t);
  requestAnimationFrame(loop);
}
document.getElementById('again').onclick=()=>{location.reload()};
document.addEventListener('click',()=>{ if(!actx){engineSound()} },{once:true});
requestAnimationFrame(loop);
</script>
</body></html>
